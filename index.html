<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NOVA Elegance</title>

<style>

body {
    margin:0;
    font-family:Arial, sans-serif;
    background:radial-gradient(circle at top,#3b2b00,#0d0d0d 50%);
    color:white;
}


/* HEADER */
header {
    text-align:center;
    padding:45px 20px;
    font-size:45px;
    font-weight:bold;
    letter-spacing:5px;
    color:#ffd700;
    text-shadow:
    0 0 10px gold,
    0 0 30px orange;
}

.subtitle {
    text-align:center;
    color:#ddd;
    letter-spacing:4px;
    margin-top:-25px;
    margin-bottom:40px;
}



/* DECORATION */
body:before {
    content:"✦ ✧ ✦ ✧ ✦";
    position:fixed;
    top:15px;
    width:100%;
    text-align:center;
    color:gold;
    opacity:.5;
    font-size:25px;
}


/* PRODUCTS */

.products {
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}


.product {

    background:linear-gradient(145deg,#222,#090909);
    width:260px;
    padding:25px;
    text-align:center;
    border-radius:20px;

    border:1px solid rgba(255,215,0,.5);

    box-shadow:
    0 0 25px rgba(255,215,0,.2);

    transition:.4s;
}


.product:hover {

    transform:translateY(-10px);

    box-shadow:
    0 0 40px gold;

}


.product h3 {

    color:#ffd700;
    font-size:23px;

}


.product p {

    font-size:22px;

}



/* BUTTON */

button {

    background:linear-gradient(45deg,#ffd700,#ff9900);

    color:black;

    border:none;

    padding:12px 25px;

    border-radius:30px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}


button:hover {

    transform:scale(1.1);

    box-shadow:0 0 20px gold;

}



/* FORM */

#orderForm {

    display:none;

    position:fixed;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    background:#111;

    width:320px;

    padding:30px;

    border-radius:20px;

    border:1px solid gold;

    box-shadow:0 0 50px gold;

    z-index:10;

}


input, textarea {

    width:100%;

    margin:8px 0;

    padding:10px;

    border-radius:10px;

    border:none;

}



/* SUCCESS */

#successMessage {

    display:none;

    text-align:center;

    margin-top:20px;

}


#successMessage h2 {

    color:gold;

}


</style>

</head>


<body>


<header>
NOVA Elegance
</header>


<div class="subtitle">
LUXURY • STYLE • UNIQUE
</div>



<section class="products">


<div class="product">

<h3>Nova T-Shirt</h3>

<p>€25</p>

<button onclick="openForm('Nova T-Shirt')">
Buy
</button>

</div>



<div class="product">

<h3>Nova Hoodie</h3>

<p>€50</p>

<button onclick="openForm('Nova Hoodie')">
Buy
</button>

</div>


</section>



<!-- ORDER FORM -->

<div id="orderForm">


<h2>Order</h2>


<form id="orderData"
action="https://formsubmit.co/kaislamiri1920@gmail.com"
method="POST">


<input type="hidden"
name="Product"
id="productInput">


<input type="text"
name="Name"
placeholder="Your Name"
required>


<input type="tel"
name="Phone"
placeholder="Phone Number"
required>


<input type="text"
name="Address"
placeholder="Address"
required>


<textarea
name="Notes"
placeholder="Notes">
</textarea>


<input type="hidden"
name="_captcha"
value="false">



<button type="submit">
Confirm Order
</button>


</form>



<div id="successMessage">

<h2>
✅ تم إرسال طلبك بنجاح
</h2>


<p>
شكراً لزيارتك واختيارك
<b>NOVA Elegance</b> ❤️
</p>


<p>
سنتصل بكم في أقرب وقت لتأكيد الطلب وتفاصيل التوصيل.
</p>


<p>
نتمنى أن تستمتع بتجربتك معنا ✨
</p>


</div>



<br>

<button onclick="closeForm()">
Close
</button>


</div>




<script>


function openForm(product){

document.getElementById("orderForm").style.display="block";

document.getElementById("productInput").value=product;

}



function closeForm(){

document.getElementById("orderForm").style.display="none";

}





document.getElementById("orderData")
.addEventListener("submit",function(e){


e.preventDefault();


fetch(this.action,{

method:"POST",

body:new FormData(this)

});



this.style.display="none";


document.getElementById("successMessage")
.style.display="block";



});



</script>


</body>

</html>
