<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NOVA Elegance</title>

<style>

body {
    margin:0;
    font-family:Arial;
    background:radial-gradient(circle at top,#3b2b00,#0d0d0d 60%);
    color:white;
}


/* HEADER */
header {
    text-align:center;
    padding:40px;
    font-size:50px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 20px gold;
}

.subtitle {
    text-align:center;
    margin-top:-25px;
    margin-bottom:40px;
    letter-spacing:4px;
    color:#ddd;
}


/* MAIN PRODUCT */
.main-product {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:50px;
    padding:40px;
    flex-wrap:wrap;
}


/* IMAGE */
.product-image img {
    width:400px;
    border-radius:20px;
    box-shadow:0 0 40px gold;
}


/* DETAILS */
.product-info {
    max-width:400px;
}

.product-info h2 {
    color:#ffd700;
    font-size:35px;
}

.price {
    font-size:28px;
    margin:10px 0;
}


/* SIZE SELECT */
select {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin:10px 0;
    font-size:16px;
}


/* BIG BUTTON */
.buy-btn {
    width:100%;
    padding:18px;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(45deg,#ffcc00,#ff6600);
    border:none;
    border-radius:30px;
    cursor:pointer;
    color:black;
    animation:pulse 1.5s infinite;
}


/* ANIMATION */
@keyframes pulse {
    0% {transform:scale(1);}
    50% {transform:scale(1.08);}
    100% {transform:scale(1);}
}

.buy-btn:hover {
    box-shadow:0 0 30px gold;
}


/* FORM */
#orderForm {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#111;
    padding:30px;
    border-radius:20px;
    border:1px solid gold;
    box-shadow:0 0 50px gold;
    width:300px;
}

input, textarea {
    width:100%;
    margin:8px 0;
    padding:10px;
    border-radius:10px;
    border:none;
}


/* SUCCESS */
#successMessage {
    display:none;
    text-align:center;
}

</style>

</head>


<body>

<header>NOVA Elegance</header>
<div class="subtitle">LUXURY • STYLE • UNIQUE</div>


<div class="main-product">

<div class="product-image">
<img src="Screenshot_20260730_021551_Gallery.jpg">
</div>


<div class="product-info">

<h2>Nova T-Shirt</h2>

<div class="price">55dt + 7dt livraison</div>

<label>Choose Size:</label>

<select id="size">
<option value="M">M</option>
</select>

<button class="buy-btn" onclick="openForm()">
🔥 BUY NOW
</button>

</div>

</div>



<!-- FORM -->

<div id="orderForm">

<h2>Order</h2>

<form id="orderData"
action="https://formsubmit.co/kaislamiri1920@gmail.com"
method="POST">

<input type="hidden" name="Product" value="Nova T-Shirt">

<input type="hidden" name="Size" id="sizeInput">

<input type="text" name="Name" placeholder="Your Name" required>
<input type="tel" name="Phone" placeholder="Phone Number" required>
<input type="text" name="Address" placeholder="Address" required>

<textarea name="Notes" placeholder="Notes"></textarea>

<input type="hidden" name="_captcha" value="false">

<button type="submit">Confirm Order</button>

</form>


<div id="successMessage">

<h2>✅ تم إرسال طلبك</h2>

<p>شكراً لزيارتك واختيارك NOVA Elegance ❤️</p>

<p>سنتصل بكم في أقرب وقت لتأكيد الطلب</p>

</div>

<br>
<button onclick="closeForm()">Close</button>

</div>



<script>

function openForm(){
document.getElementById("orderForm").style.display="block";

var size=document.getElementById("size").value;
document.getElementById("sizeInput").value=size;
}

function closeForm(){
document.getElementById("orderForm").style.display="none";
}


document.getElementById("orderData")
.addEventListener("submit",function(e){

e.preventDefault();

fetch(this.action,{
method:"POST",
body:new FormData(this)
});

this.style.display="none";
document.getElementById("successMessage").style.display="block";

});

</script>

</body>
</html>
